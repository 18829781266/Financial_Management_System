# Managed by huitong-cloud installer. Only this file is managed.
server {
    listen 80;
    server_name @@IP@@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/huitong-acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://@@IP@@$request_uri; }
}
server {
    listen 443 ssl;
    server_name @@IP@@;
    ssl_certificate /etc/huitong/letsencrypt/live/huitong-ip/fullchain.pem;
    ssl_certificate_key /etc/huitong/letsencrypt/live/huitong-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HuitongTLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host @@IP@@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
