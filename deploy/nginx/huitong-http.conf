# Managed by huitong-cloud installer. Only this file is managed.
server {
    listen 80;
    server_name @@IP@@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/huitong-acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503 "HTTPS certificate setup is in progress.\n";
        add_header Content-Type text/plain;
    }
}
